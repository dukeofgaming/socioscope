[package]
name = "socioscope-studio"
version = "0.1.0"
edition = "2024"
description = "Socioscope caption studio"
publish = false

[[bin]]
name = "socioscope-studio"
path = "src/main.rs"

[dependencies]
gpui = { package = "gpui-ce", version = "0.3" }
gpui_ce_elements = "0.3"
gpui_platform = { package = "gpui_ce_platform", version = "0.3", features = ["x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
