[package]
name = "socioscope"
version = "0.1.0"
edition = "2021"
description = "Transcribe and diarize audio. Rust port of the socioscope CLI."
license = "MIT"

[dependencies]
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
sherpa-onnx = { version = "=2.0.1", default-features = false, features = ["shared"] }
whisper-rs = "0.16"

# whisper.cpp Metal backend. Cargo unions this with the dependency above.
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }

[dev-dependencies]
cucumber = "0.23.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[[test]]
name = "specs"
harness = false
