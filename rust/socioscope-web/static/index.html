<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>socioscope</title>
  <script src="/htmx.min.js"></script>
  <style>
    :root { color-scheme: light dark; }
    body {
      font: 16px/1.45 ui-sans-serif, system-ui, sans-serif;
      margin: 2.5rem auto;
      max-width: 42rem;
      padding: 0 1rem;
    }
    form { display: flex; gap: 0.5rem; }
    input, button { font: inherit; padding: 0.4rem 0.6rem; }
    input { flex: 1; min-width: 0; }
    code { font-family: ui-monospace, monospace; }
    pre {
      white-space: pre-wrap;
      max-height: 24rem;
      overflow: auto;
      padding: 0.75rem;
    }
    .error { color: #b00020; }
    p.hint { color: ButtonText; opacity: 0.7; }
  </style>
</head>
<body>
  <h1>socioscope</h1>
  <p class="hint">Transcribe a local audio file or directory. Models stay loaded until this process exits.</p>
  <form hx-post="/jobs" hx-target="#job" hx-swap="innerHTML" hx-disabled-elt="button">
    <input name="file" required placeholder="tests/data/jfk.wav" autocomplete="off" spellcheck="false">
    <button type="submit">Transcribe</button>
  </form>
  <div id="job"></div>
</body>
</html>
